per_listener_settings false
allow_anonymous false
acl_file /mosquitto/tls/acl

listener 8883
cafile /mosquitto/tls/ca-chain.crt
certfile /mosquitto/tls/broker.crt
keyfile /mosquitto/tls/broker.key
crlfile /mosquitto/tls/crl.pem
require_certificate true
use_identity_as_username true

persistence true
persistence_location /mosquitto/data/

log_dest stderr
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S%z
