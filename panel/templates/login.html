{% extends "base.html" %}
{% block conteudo %}
<div class="cartao" style="max-width:380px;margin:3rem auto;">
  <h1>Entrar</h1>
  {% if erro %}<p class="erro">{{ erro }}</p>{% endif %}
  <form method="post">
    <p><label>Usuário<br><input name="usuario" autofocus autocomplete="username" style="width:100%"></label></p>
    <p><label>Senha<br><input name="senha" type="password" autocomplete="current-password" style="width:100%"></label></p>
    <button type="submit">Entrar</button>
  </form>
</div>
{% endblock %}
