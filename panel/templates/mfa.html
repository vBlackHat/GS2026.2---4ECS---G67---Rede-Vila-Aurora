{% extends "base.html" %}
{% block conteudo %}
<div class="cartao" style="max-width:380px;margin:3rem auto;">
  <h1>Verificação em duas etapas</h1>
  <p>Digite o código de 6 dígitos do seu aplicativo autenticador.</p>
  {% if erro %}<p class="erro">{{ erro }}</p>{% endif %}
  <form method="post">
    <p><label for="codigo">Código de verificação (6 dígitos)</label><br>
    <input id="codigo" name="codigo" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" autofocus style="width:100%"></p>
    <button type="submit">Confirmar</button>
  </form>
</div>
{% endblock %}
